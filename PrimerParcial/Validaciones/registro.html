<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./Diseño/style.css">
  <title>Registrar Asistencia - CECyT 9</title>
  <link rel="stylesheet" href="style.css">
  <script src="./js/validaciones.js"></script>
</head>
<body>
<header>
  <a href="./detalle.html">Volver al taller</a>
</header>
<main>
  <form class="formulario-registro" id="form-registro" novalidate>
    <h1>Registrar Asistencias</h1>

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required>
    <span class="error" id="error-nombre"></span>

    <label for="boleta">Numero de boleta:</label>
    <input type="text" id="boleta" name="boleta" required>
    <span class="error" id="error-boleta"></span>
    <br><br>

    <label for="fecha">Fecha de registro (DD/MM/AAAA)</label>
    <input type="text" id="fecha" name="fecha" placeholder="DD/MM/AAAA" required>
    <span class="error" id="error-fecha"></span>

    <label for="email">Email:</label>
    <input type="email" name="email" required id="email">
    <p class="textoError">Error en el email</p>
    <p class="textoPermitido">Email permitido</p>
    <br><br>
    <button class="botonRegistro" type="submit">Registrar</button>
    <p class="mensaje-exito" id="mensaje-exito" ></p>
  </form>
</main>
</body>
</html>
