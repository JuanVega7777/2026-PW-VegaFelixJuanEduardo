<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejecicios con Node</title>
    <link rel="stylesheet" href="./../Validaciones/Diseño/style.css">
</head>


<body>
    <header>
        <h1>Ejercicios con node</h1>
    </header>
    <main>
        <section class="ejercicio" >
            <h2 id="titulo-arreglos"> Arreglos del codigo <code>01-arreglos.js</code> </h2>
            <p>Datos de prueba con JS</p>
            <div class="tabla-scroll" >
                <table id="tabla-talleres">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Instructor</th>
                            <th>Cupo</th>
                            <th>Inscritos</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>

            <form id="form-arreglos" class="formulario" >
                <div class="campos" >
                    <label for="operacion-arreglo" name="operacion-arreglo">Operación</label>
                    <select name="operacion-arreglo" id="operacion-arreglo">
                        <option value="forEach">ForEach - Lista Simple</option>
                        <option value="map">map - Copia solo Nombres</option>
                        <option value="filter">filter - Filtrar Talleres con cupo lleno</option>
                        <option value="find">find - Buscar por el nombre del instructor</option>
                    </select>
                </div>

                <button type="submit" >Ejecutar</button>

            </form>

            <output class="resultado" id="resultado-arreglo" for="form-arreglo" ></output>
        </section>

<section class="ejercicio" aria-labelledby="titulo-objeto">
            <h2 id="titulo-objeto">Manejo de Objetos y Json</h2>
            <p>Edita el taller y elije que operación deseas aplicar</p>
 
            <form id="form-objeto" class="formulario">
                <div class="campo">
                <label for="obj-nombre">Nombre</label>
                <input type="text" name="obj-nombre" id="obj-nombre" value="Introducción a Python">
            </div>
            <div class="campo">
                <label for="obj-instructor">Instructor</label>
                <input type="text" name="obj-instructor" id="obj-instructor" value="Ing. María López">
            </div>
            <div class="campo">
                <label for="obj-cupo">Cupo</label>
                <input type="text" name="obj-cupo" id="obj-cupo" value="25" min="0">
            </div>
            <div class="campo">
                <label for="obj-inscritos">Inscritos</label>
                <input type="text" name="obj-inscritos" id="obj-inscritos" value="25" min="0">
            </div>
            <div class="campo">
                <label for="operacion-objeto">Tipo de Operación</label>
                <select name="operacion-objeto" id="operacion-objeto">
                    <option value="keys">Object.keys</option>
                    <option value="values">Object.values</option>
                    <option value="entries">Object.entries</option>
                    <option value="stringify">JSON a Cadena</option>
                    <option value="roundtrip">Ida y Vuelta (JSON a Cadena)</option>
                </select>
            </div>
            <button type="submit">Ejecutar Opción</button>
        </form>
            <output class="resultado" id="resultado-objeto" for="form-objeto"></output>
        </section>
        

        <section class="videoGatitos">

            <video src="./../Validaciones/Diseño/Img/trend cute kitten dance.mp4" muted autoplay loop></video>    
        </section>

        


        <footer>
        <p>Juan Eduardo Vega Felix</p>
        <a href="./../../index.html">Regresar</a>
    </footer>
    </main>

    <script src="./js/02-objetos-json.js" ></script>
    
    
</body>
</html>
